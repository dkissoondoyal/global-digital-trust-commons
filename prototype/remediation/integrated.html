<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDTC v0.2 Evidence to Guidance</title><style>body{font:16px/1.55 system-ui;max-width:900px;margin:auto;padding:1.5rem;background:#f4f8fb;color:#182e3c}header,section,article{padding:1rem;margin:1rem 0;background:white;border:1px solid #cddde5;border-radius:10px}button,select,input{padding:.5rem}button{background:#065679;color:white;border:0;border-radius:5px}button:focus,select:focus,input:focus{outline:3px solid orange}.warning{background:#fff3d9;border-left:5px solid #a65b00;padding:.7rem}article{border-left:5px solid #087b99}</style><header><h1 id="title"></h1><p id="warning" class="warning"></p><label for="language">Language / Langue</label> <select id="language"><option value="en">English</option><option value="fr">Français</option></select></header><section><h2 id="heading"></h2><p id="instructions"></p><button id="sample"></button><p><label id="filelabel" for="file"></label> <input type="file" id="file" accept=".json,application/json"></p><p id="feedback" role="status" aria-live="polite"></p></section><main id="results" aria-live="polite"></main><footer><small id="foot"></small></footer><script>
"use strict";
const SOURCES={hsts:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security",csp:"https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP",nosniff:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options"};
const T={
en:{title:"GDTC: Evidence → Guidance",warning:"EXPERIMENTAL: fictional example or locally supplied evidence only. No scanning, uploads or automatic remediation. Do not import sensitive reports. Not a security audit.",heading:"Local evidence and guided remediation",instructions:"Load fictional data or import a JSON report from the GDTC offline header assessor. Data stays in this browser session.",sample:"Load fictional report",filelabel:"Import local JSON report:",foot:"A header's presence does not prove security. Recommendations require human approval.",loaded:"Report loaded. Evidence is user supplied and not independently verified.",error:"Invalid report: ",finding:"Observation",status:"Status",evidence:"Evidence provenance",why:"Explanation",steps:"Recommended actions",verify:"How to verify",source:"Reference",not_observed:"Not observed in supplied response",requires_review:"Configuration requires review",observed_review_configuration:"Observed; configuration still requires review",hsts:{name:"HSTS",why:"A single supplied response does not establish site-wide HSTS configuration.",steps:["Confirm the response was delivered over HTTPS.","Review subdomain readiness and rollback risks before rollout.","Test a proposed policy with an authorised administrator."],verify:"Recheck authorised HTTPS responses and affected hostnames."},csp:{name:"Content Security Policy",why:"CSP presence or absence alone does not establish application security.",steps:["Inventory scripts and resources.","Evaluate a policy in report-only mode when appropriate.","Test representative pages before enforcement."],verify:"Recheck response headers and application behaviour."},nosniff:{name:"X-Content-Type-Options",why:"This observation concerns a browser hardening header.",steps:["Check that MIME types are correct.","Review the nosniff directive with the administrator.","Test affected resources after approval."],verify:"Recheck the header and verify resources still load."}},
fr:{title:"GDTC : Preuves → Conseils",warning:"EXPÉRIMENTAL : exemple fictif ou preuve locale. Aucun scan, transfert ni correction automatique. Ne chargez aucune donnée sensible. Ceci n’est pas un audit.",heading:"Preuves locales et remédiation guidée",instructions:"Chargez un exemple fictif ou importez le rapport JSON local de l'outil GDTC. Les données restent dans cette session.",sample:"Charger le rapport fictif",filelabel:"Importer un rapport JSON local :",foot:"La présence d'un en-tête ne prouve pas la sécurité. Une validation humaine est nécessaire.",loaded:"Rapport chargé. Preuves fournies par l'utilisateur et non vérifiées indépendamment.",error:"Rapport invalide : ",finding:"Observation",status:"État",evidence:"Provenance",why:"Explication",steps:"Actions recommandées",verify:"Vérification",source:"Référence",not_observed:"Non observé dans la réponse fournie",requires_review:"Configuration à examiner",observed_review_configuration:"Observé ; configuration à examiner",hsts:{name:"HSTS",why:"Une seule réponse ne démontre pas la configuration HSTS de tout un site.",steps:["Vérifier que la réponse provient de HTTPS.","Examiner les sous-domaines et les risques de retour arrière.","Tester la politique avec un administrateur autorisé."],verify:"Revérifier les réponses HTTPS et les hôtes concernés."},csp:{name:"Politique de sécurité du contenu",why:"La présence ou l'absence de CSP ne prouve pas la sécurité de l'application.",steps:["Recenser les scripts et ressources.","Évaluer le mode rapport si approprié.","Tester les pages représentatives avant activation."],verify:"Revérifier les en-têtes et le comportement."},nosniff:{name:"X-Content-Type-Options",why:"Cette observation concerne le renforcement du navigateur.",steps:["Vérifier les types MIME.","Examiner la directive nosniff avec l'administrateur.","Tester les ressources après approbation."],verify:"Revérifier l'en-tête et le chargement."}}};
const EXAMPLE={schema_version:"0.2-experimental",source:"synthetic-fixture",findings:[{control_id:"hsts",status:"not_observed",evidence_type:"user_supplied_http_headers"},{control_id:"csp",status:"not_observed",evidence_type:"user_supplied_http_headers"},{control_id:"nosniff",status:"observed_review_configuration",evidence_type:"user_supplied_http_headers"}]};
let current=null;const $=id=>document.getElementById(id);const el=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n;};
function validateReport(report){if(!report||typeof report!=="object"||Array.isArray(report)||report.schema_version!=="0.2-experimental"||!Array.isArray(report.findings)||report.findings.length>20)throw Error("unsupported schema");const statuses=new Set(["not_observed","requires_review","observed_review_configuration"]),seen=new Set();for(const f of report.findings){if(!f||typeof f!=="object"||!Object.hasOwn(SOURCES,f.control_id)||!statuses.has(f.status)||f.evidence_type!=="user_supplied_http_headers"||seen.has(f.control_id))throw Error("invalid or duplicate finding");seen.add(f.control_id);}if(report.source!==undefined&&(typeof report.source!=="string"||report.source.length>512))throw Error("invalid source");return report;}
function render(){const lang=$("language").value,t=T[lang];document.documentElement.lang=lang;for(const k of ["title","warning","heading","instructions","sample","filelabel","foot"])$(k).textContent=t[k];const out=$("results");out.replaceChildren();if(!current)return;for(const f of current.findings){const k=t[f.control_id],card=el("article","");card.append(el("h2",t.finding+": "+k.name),el("p",t.status+": "+t[f.status]),el("p",t.evidence+": "+f.evidence_type+" ("+(current.source||"unspecified")+")"),el("h3",t.why),el("p",k.why),el("h3",t.steps));const ol=document.createElement("ol");for(const step of k.steps)ol.append(el("li",step));card.append(ol,el("h3",t.verify),el("p",k.verify),el("h3",t.source));const a=el("a",SOURCES[f.control_id]);a.href=SOURCES[f.control_id];a.target="_blank";a.rel="noopener noreferrer";card.append(a);out.append(card);}}
$("language").addEventListener("change",render);$("sample").addEventListener("click",()=>{current=validateReport(EXAMPLE);$("feedback").textContent=T[$("language").value].loaded;render();});$("file").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>65536)throw Error("file exceeds 64 KiB");const report=validateReport(JSON.parse(await file.text()));current=report;$("feedback").textContent=T[$("language").value].loaded;render();}catch(err){current=null;$("results").replaceChildren();$("feedback").textContent=T[$("language").value].error+err.message;}finally{e.target.value="";}});render();
</script></html>
